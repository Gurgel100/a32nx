[package]
name = "fdr-analyzer"
version = "0.1.0"
edition = "2024"
description = "GUI application for analyzing FlyByWire FDR files"

#[workspace]

[build-dependencies]
bindgen = "0.72"

[dependencies]
# GUI framework
eframe = "0.35"
egui = "0.35"
egui_plot = "0.36"

# File / I/O
flate2 = "1.1"
memmap2 = "0.9"
bytemuck = { version = "1.25", features = ["derive"] }

# Data serialization / export
serde = { version = "1.0", features = ["derive"] }
csv = "1.4"

# Concurrency & misc
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

# Native file dialog
rfd = "0.15"

# Image export support
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
strip = true
